name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Validate JavaScript syntax"
        run: |
          node --check scripts/run-markdownlint.js
          if [ -f tools/js/sncouncil-minutes-downloader.js ]; then
            node --check tools/js/sncouncil-minutes-downloader.js
          fi
