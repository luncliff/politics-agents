name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: "Run markdown lint warnings"
        run: |
          npm ci
          npm run lint

      - name: "Check JS/TS formatting"
        run: |
          npm run format:check
